[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-grid-openenv"
version = "0.1.0"
description = "Realistic national electricity grid simulation environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.24.0",
    "openai>=1.30.0,<3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
legacy = [
    "openenv-core[core]>=0.2.1,<0.3",
    "pillow>=13.0.0; python_version >= '3.11'",
]
legacy-training = [
    "torch==2.2.2",
    "transformers==4.36.2",
    "peft==0.7.1",
    "accelerate",
    "datasets",
    "numpy<2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
]

[project.scripts]
# Legacy energy-grid server entry point.
server = "server.app:main"
gridmind-server = "server.gridmind_app:main"

[tool.setuptools]
include-package-data = true
py-modules = ["client", "models", "inference"]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
lint.ignore = ["N999"]